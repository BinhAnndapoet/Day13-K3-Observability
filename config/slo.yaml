service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: 99.5% requests phai dat P95 latency <= 3000ms trong 28 ngay
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Error rate khong vuot qua 2% trong 99% thoi gian của cua so 28 ngay
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Tong chi phi API khong vuot $2.5/ngay trong 100% thoi gian
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: 95% thoi gian trong cua so quality score trung binh dat tu 0.75 tro len
