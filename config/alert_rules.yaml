alerts:
  - name: high_latency_p95
    severity: critical
    condition: "latency_p95 > 3000ms for 5 minutes"
    type: symptom-based
    owner: sre-team
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2% for 3 minutes"
    type: symptom-based
    owner: sre-team
    runbook: docs/alerts.md#alert-2
  - name: cost_spike
    severity: warning
    condition: "total_cost_usd > 2.5 within 24h window"
    type: symptom-based
    owner: sre-team
    runbook: docs/alerts.md#alert-3
